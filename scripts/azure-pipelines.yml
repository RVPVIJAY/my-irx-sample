trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: appscan-secrets
  - group: appscan-state
  - name: SACLIENT_HOME
    value: C:\SAClientUtil

steps:
  - checkout: self

  - task: Maven@3
    displayName: 'Task 1 - Maven build'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
      publishJUnitResults: false

  - task: PowerShell@2
    displayName: 'Copy pom.xml into target'
    inputs:
      targetType: 'inline'
      script: Copy-Item "$(Build.SourcesDirectory)\pom.xml" "$(Build.SourcesDirectory)\target\pom.xml" -Force

  - task: PowerShell@2
    displayName: 'Task 2 - Generate IRX (first run only)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      filePath: 'scripts/generate_irx.ps1'
    env:
      SACLIENT_HOME: $(SACLIENT_HOME)

  - task: PowerShell@2
    displayName: 'Task 3 - Create scan and store scan ID (first run only)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      filePath: 'scripts/create_scan.ps1'
      arguments: '-ScanName "sample-app-build-$(Build.BuildNumber)"'
    env:
      SACLIENT_HOME: $(SACLIENT_HOME)
      ASOC_KEY_ID: $(ASOC_KEY_ID)
      ASOC_KEY_SECRET: $(ASOC_KEY_SECRET)
      APPSCAN_APP_ID: $(APPSCAN_APP_ID)
      APPSCAN_SERVER: $(APPSCAN_SERVER)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: HCLAppScanOnCloud@2
    displayName: 'Task 4 - Rescan with AppScan plug-in (not first run)'
    condition: and(succeeded(), ne(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      AppSecTestService: 'appscan360-conn'
      applications: '$(APPSCAN_APP_ID)'
      scanname: 'sample-app-rescan-$(Build.BuildNumber)'
      scantype: 'static'
      rescan: true
      scanid: '$(APPSCAN_SCAN_ID)'
      scanloc: '$(Build.SourcesDirectory)\target'
      scanMethod: 'IRX'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish IRX (first run only)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      PathtoPublish: 'irx-output'
      ArtifactName: 'irx'
